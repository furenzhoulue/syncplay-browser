name = "syncplay-relay"
main = "src/index.js"
compatibility_date = "2026-01-01"

# One Durable Object per room code. Free tier is plenty for an MVP watch party.
[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomDurableObject" }
]

[[migrations]]
tag = "v1"
new_classes = ["RoomDurableObject"]
